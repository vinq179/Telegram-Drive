services:
  telegram-drive:
    build:
      context: ..
      dockerfile: headless/Dockerfile
    image: aivaults/telegram-drive-headless:local
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_DRIVE_API_KEY: ${TELEGRAM_DRIVE_API_KEY}
      TELEGRAM_SESSION_PATH: /data/telegram.session
      TELEGRAM_DRIVE_BIND: 0.0.0.0:8550
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - telegram_drive_data:/data
    networks:
      - dmcms_internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8550/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Deliberately no host `ports:`. DMCMS reaches this service only on the
    # private Docker network as http://telegram-drive:8550/api/v1.

volumes:
  telegram_drive_data:
    name: aivaults_telegram_drive_data

networks:
  dmcms_internal:
    external: true
    name: dmcms_internal
